# BEGIN_KITTY_THEME
# Hyprlain
include current-theme.conf
# END_KITTY_THEME

# Font
font_family AdwaitaMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Cursor trail (Hyprlain)
cursor_beam_thickness 2.0
cursor_shape beam
cursor_blink_interval 0
cursor_trail 1

show_hyperlink_targets yes
url_style simple

# Layouts and chrome
tab_bar_align center
tab_bar_margin_width 4
tab_fade 1 1 1
window_padding_width 4
window_margin_width 4
window_border_width 1
draw_minimal_borders no
hide_window_decorations no
adjust_line_height 5

inactive_text_alpha .8
enable_audio_bell no
bell_on_tab no
window_alert_on_bell no

enabled_layouts Tall:bias=65, Fat:bias=65, Stack, Grid, Horizontal, Vertical
remember_window_size no
editor helix
allow_remote_control yes
background_opacity 0.95

# Keymaps from niri-dots
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+e send_text all spf\r
map ctrl+shift+g send_text all zi\r

map ctrl+equal change_font_size current +2.0
map kitty_mod+plus     change_font_size all +2.0
map kitty_mod+backspace change_font_size all 0

map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd

map alt+right neighboring_window right
map alt+left neighboring_window left
map alt+up neighboring_window up
map alt+down neighboring_window down

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map ctrl+alt+left resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up resize_window taller
map ctrl+alt+down resize_window shorter
